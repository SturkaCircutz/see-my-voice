name: Deploy GitHub Pages

on:
  push:
    branches:
      - seemyvoice-4.0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p pages-site
          cp -R web/index.html web/app.js web/state.js web/styles.css web/config.js web/assets web/.nojekyll pages-site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
